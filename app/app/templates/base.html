<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ asset('css/app.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text y='68' x='50' text-anchor='middle' font-size='54' fill='white' font-family='sans-serif'>C</text></svg>">
<script src="{{ asset('vendor/htmx.min.js') }}" defer></script>
<script src="{{ asset('js/app.js') }}" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">OSM</div>
      <div>
        <div class="name">{{ app_name }}</div>
        <div class="sub">{{ tagline }}</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if page == 'home' }}"><span class="ic">⌂</span> Home</a>
      <a href="/operations" class="{{ 'active' if page == 'operations' }}"><span class="ic">⇄</span> Operations</a>
      <a href="/install" class="{{ 'active' if page == 'install' }}"><span class="ic">⤓</span> Install &amp; Configure</a>
      <a href="/setup" class="{{ 'active' if page == 'setup' }}"><span class="ic">⚙</span> Setup</a>
      <div class="nav-sep">Reference</div>
      <a href="/install#tools"><span class="ic">▤</span> Tools</a>
      <a href="/operations#jobs"><span class="ic">▶</span> Job history</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumbs">{% block crumbs %}{% endblock %}</div>
        <strong>{% block heading %}{% endblock %}</strong>
      </div>
      <div class="actions">
        {% block topactions %}{% endblock %}
        <button class="btn ghost sm" onclick="toggleTheme()" title="Light or dark">◐</button>
        <a class="btn ghost sm" href="/logout">Sign out</a>
      </div>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
