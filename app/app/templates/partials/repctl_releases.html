{% if error %}
  <div class="banner warn" style="margin:0 0 .4rem"><span>⚠</span>
    <div>{{ error }} Upload a binary instead.</div></div>
  <select name="url"><option value="">no releases listed</option></select>
{% else %}
<select name="url">
  {% for r in releases %}
    {% if r.has_binary %}
      <option value="{{ r.url }}">{{ r.tag }} ({{ r.published }}) - binary published</option>
    {% else %}
      <option value="" disabled>{{ r.tag }} ({{ r.published }}) - source only, build it</option>
    {% endif %}
  {% endfor %}
</select>
{% endif %}
