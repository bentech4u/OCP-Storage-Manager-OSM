<div class="card">
  <div class="card-head"><div><h3>{{ spec.label }} - {{ rg }}</h3>
    <div class="sub">{{ spec.help }}</div></div></div>
  <form hx-post="/operations/action" hx-target="#output">
    <input type="hidden" name="rg" value="{{ rg }}">
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="cluster" value="{{ cluster }}">
    <div class="row">
      {% if spec.needs_target %}
      <div class="field"><label>{{ "Run at" if action == "reprotect" else "Target cluster" }}</label>
        <select name="target">
          {% for c in (others if action != "reprotect" else clusters) %}
            <option value="{{ c.id }}">{{ c.id }}</option>{% endfor %}
        </select>
        <div class="hint">This is the repctl cluster id, the same name used in the storage class.</div></div>
      {% endif %}
      <div class="field" style="display:flex;align-items:flex-end">
        <div>
          {% if action == "failover" %}
          <div class="check"><input type="checkbox" id="unplanned" name="unplanned">
            <label for="unplanned">Unplanned, the source site is unreachable</label></div>
          {% endif %}
          {% if action == "failback" %}
          <div class="check"><input type="checkbox" id="discard" name="discard">
            <label for="discard">Discard changes written at the target</label></div>
          {% endif %}
        </div>
      </div>
    </div>
    <div class="console" style="max-height:60px;margin-bottom:.7rem">{{ preview }}</div>
    <button class="btn {{ 'danger' if spec.danger else 'primary' }}"
      data-confirm="{{ spec.label }} on {{ rg }}. Continue?">Run {{ spec.label|lower }}</button>
  </form>
</div>
